  <circle cx="102" cy="111" r="9" fill="#22D3EE"/>
  <text x="158" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="700" fill="#171126">CalibiAI</text>
  <text x="163" y="90" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D28D9" letter-spacing="2">AI COSTING AGENT</text>
